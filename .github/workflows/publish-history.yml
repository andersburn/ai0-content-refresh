name: Publish historical plugin versions
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Import verified sources and publish original release ZIP files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone "$GITHUB_REPOSITORY" publication -- --branch main
          cd publication
          if [ ! -f publication.zip ]; then
            echo "Historical versions have already been imported."
            gh release list --limit 5
            exit 0
          fi
          echo 'ed61fc1dc075e1a5d5641b7beaffe35350b280b4da68eb3ad7bf1b471256f5d7  publication.zip' | sha256sum -c -
          payload="$RUNNER_TEMP/ai0r-import"
          mkdir -p "$payload"
          unzip -q publication.zip -d "$payload"
          (cd "$payload" && sha256sum -c SHA256SUMS)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch "$payload/source.bundle" 'refs/heads/main:refs/remotes/archive/main' 'refs/tags/*:refs/tags/*'
          git merge --allow-unrelated-histories refs/remotes/archive/main -m 'Import original plugin versions 1.0.0 through 1.4.0'
          git push --atomic origin HEAD:main --tags
          for version in 1.0.0 1.1.0 1.2.0 1.3.0 1.4.0; do
            if gh release view "v$version" >/dev/null 2>&1; then
              echo "Keeping existing release v$version"
              continue
            fi
            latest=false
            if [ "$version" = '1.4.0' ]; then latest=true; fi
            gh release create "v$version" "$payload/assets/ai0-content-refresh-$version.zip" \
              --verify-tag --title "Ai0 Content Refresh $version" \
              --notes-file "release-notes/v$version.md" --latest="$latest"
          done
          git rm publication.zip
          git commit -m 'Remove completed one-time release import archive'
          git push origin HEAD:main
          printf '## Published versions\n\n' >> "$GITHUB_STEP_SUMMARY"
          gh release list --limit 5 >> "$GITHUB_STEP_SUMMARY"
