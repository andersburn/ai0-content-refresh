name: Publish English plugin release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish verified English version and translate release descriptions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone "$GITHUB_REPOSITORY" publication -- --branch main
          cd publication
          if [ ! -f publication-1.5.0.zip ]; then
            echo "English release import has already completed."
            gh release view v1.5.0
            exit 0
          fi
          echo '69905b646390b53d726818450d4cd9c4d94cd9092e8cee12b9a3eb5489900b12  publication-1.5.0.zip' | sha256sum -c -
          payload="$RUNNER_TEMP/ai0r-english-import"
          mkdir -p "$payload"
          unzip -q publication-1.5.0.zip -d "$payload"
          (cd "$payload" && sha256sum -c SHA256SUMS)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch "$payload/source.bundle" 'refs/heads/main:refs/remotes/archive/main' 'refs/tags/v1.5.0:refs/tags/v1.5.0'
          git merge refs/remotes/archive/main -m 'Import English version 1.5.0 and bundled Danish translations'
          git push --atomic origin HEAD:main refs/tags/v1.5.0:refs/tags/v1.5.0
          for version in 1.0.0 1.1.0 1.2.0 1.3.0 1.4.0; do
            gh release edit "v$version" --title "Ai0 Content Refresh $version" --notes-file "release-notes/v$version.md"
          done
          if ! gh release view v1.5.0 >/dev/null 2>&1; then
            gh release create v1.5.0 "$payload/ai0-content-refresh-1.5.0.zip" "$payload/update.json" \
              --verify-tag --title 'Ai0 Content Refresh 1.5.0' \
              --notes-file release-notes/v1.5.0.md --latest
          fi
          gh release view v1.5.0 --json tagName,assets,isDraft,isPrerelease
          git rm publication-1.5.0.zip
          git commit -m 'Remove completed English release import archive'
          git push origin HEAD:main
          printf '## Published English version 1.5.0\n\n' >> "$GITHUB_STEP_SUMMARY"
          gh release list --limit 6 >> "$GITHUB_STEP_SUMMARY"
