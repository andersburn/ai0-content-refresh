name: Publish version 1.6.0
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish verified version 1.6.0 and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone "$GITHUB_REPOSITORY" publication -- --branch main
          cd publication
          if [ ! -f publication-1.6.0.zip ]; then
            echo "Publishing release import has already completed."
            gh release view v1.6.0
            exit 0
          fi
          echo '18e96c15d9c039befce13d945e5de12283f4e392e40ba29ac59bdeafabdfaca3  publication-1.6.0.zip' | sha256sum -c -
          payload="$RUNNER_TEMP/ai0r-publishing-import"
          mkdir -p "$payload"
          unzip -q publication-1.6.0.zip -d "$payload"
          (cd "$payload" && sha256sum -c SHA256SUMS)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch "$payload/source.bundle" 'refs/heads/main:refs/remotes/archive/main' 'refs/tags/v1.6.0:refs/tags/v1.6.0'
          git merge refs/remotes/archive/main -m 'Import version 1.6.0 with consistent publishing choices'
          git push --atomic origin HEAD:main refs/tags/v1.6.0:refs/tags/v1.6.0
          if ! gh release view v1.6.0 >/dev/null 2>&1; then
            gh release create v1.6.0 "$payload/ai0-content-refresh-1.6.0.zip" "$payload/update.json" \
              --verify-tag --title 'Ai0 Content Refresh 1.6.0' \
              --notes-file release-notes/v1.6.0.md --latest
          fi
          gh release view v1.6.0 --json tagName,assets,isDraft,isPrerelease
          git rm publication-1.6.0.zip
          git commit -m 'Remove completed version 1.6.0 release import archive'
          git push origin HEAD:main
          printf '## Published version 1.6.0\n\n' >> "$GITHUB_STEP_SUMMARY"
          gh release list --limit 7 >> "$GITHUB_STEP_SUMMARY"
